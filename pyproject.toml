[tool.ruff]
line-length = 119
target-version = "py313"
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "UP"]
ignore = ["N999"]

[tool.ruff.lint.isort]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "drf",
    "django",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
drf = ["rest_framework", "rest_framework_simplejwt"]
django = ["django"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501"]

[tool.ruff.format]
quote-style = "single"
